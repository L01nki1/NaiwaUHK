<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="页面跳转中">
  <title>正在跳转</title>
  <style>
    :root {
      --ink: #3f2020;
      --muted: #806265;
      --line: #f2c1a6;
      --paper: #fff8f3;
      --surface: #fffdfb;
      --accent: #ff8a4c;
      --accent-strong: #d83a62;
      --accent-soft: #ffd6b8;
      --warm-yellow: #ffc15a;
      --shadow: 0 16px 36px rgba(169, 65, 55, 0.16), 0 3px 8px rgba(169, 65, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 193, 90, 0.38), transparent 25%),
        radial-gradient(circle at 8% 88%, rgba(216, 58, 98, 0.14), transparent 27%),
        linear-gradient(135deg, #fff8f3 0%, #fff1e7 100%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    header,
    footer {
      min-height: 80px;
      display: flex;
      align-items: center;
      padding: 20px clamp(24px, 7vw, 112px);
      border-color: var(--line);
    }

    header {
      justify-content: space-between;
      border-bottom: 1px solid rgba(242, 193, 166, 0.8);
      background: rgba(255, 253, 251, 0.78);
    }

    footer {
      justify-content: space-between;
      border-top: 1px solid rgba(242, 193, 166, 0.8);
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      background: rgba(255, 253, 251, 0.78);
    }

    .runtime {
      margin: 0;
    }

    .github-link {
      padding: 9px 15px;
      border: 1px solid rgba(216, 58, 98, 0.25);
      border-radius: 999px;
      background: rgba(255, 214, 184, 0.4);
      color: #a43d48;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    .github-link:hover {
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .github-link:focus-visible {
      outline: 3px solid rgba(216, 58, 98, 0.35);
      outline-offset: 3px;
    }

    .brand {
      color: var(--ink);
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.02em;
    }

    .header-note {
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 64px 24px 72px;
    }

    .panel {
      width: min(100%, 620px);
      padding: clamp(36px, 7vw, 72px);
      border: 1px solid rgba(242, 193, 166, 0.75);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .character-wrap {
      display: grid;
      min-height: 226px;
      margin: -28px auto 30px;
      place-items: end center;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.9), transparent 42%),
        linear-gradient(145deg, var(--warm-yellow), var(--accent-soft) 55%, #f28a83);
    }

    .character {
      display: block;
      width: min(100%, 280px);
      height: 270px;
      object-fit: contain;
      mix-blend-mode: multiply;
      animation: character-float 3.6s ease-in-out infinite;
    }

    .eyebrow {
      display: inline-flex;
      margin: 0 0 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #a43d48;
      font-family: "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .target {
      margin: 18px 0 42px;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .countdown {
      display: grid;
      width: 154px;
      height: 154px;
      margin: 0 auto 34px;
      place-items: center;
      position: relative;
      border-radius: 50%;
      background: conic-gradient(var(--accent-strong) var(--progress, 100%), var(--accent-soft) 0);
      animation: breathe 2s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(216, 58, 98, 0.18);
    }

    .countdown::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--surface);
    }

    .seconds {
      position: relative;
      color: var(--ink);
      font-size: 58px;
      font-weight: 700;
      line-height: 1;
    }

    .seconds-label {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .message {
      margin: 0;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .fallback {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 4px 10px rgba(216, 58, 98, 0.22);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .fallback:hover {
      background: #ff9b68;
      box-shadow: 0 7px 14px rgba(216, 58, 98, 0.3);
      text-decoration: none;
      transform: translateY(-2px);
    }

    .fallback:focus-visible {
      outline: 3px solid rgba(216, 58, 98, 0.38);
      outline-offset: 3px;
    }

    @keyframes breathe {
      0%,
      100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes character-float {
      0%,
      100% { transform: translateY(4px); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 520px) {
      header,
      footer {
        min-height: 68px;
        padding: 16px 20px;
      }

      footer {
        flex-direction: column;
        gap: 12px;
      }

      .header-note {
        display: none;
      }

      main {
        padding: 36px 16px;
      }

      .panel {
        padding: 38px 22px 42px;
        border-radius: 26px;
      }

      .character-wrap {
        min-height: 188px;
        margin: -12px auto 28px;
        border-radius: 22px;
      }

      .character {
        height: 224px;
      }
    }
  </style>
</head>
<body>
  <!-- 页眉编辑区域：可替换品牌、导航或其他内容 -->
  <header>
    <div class="brand">香港奶蛙大學</div>
    <div class="header-note">NAIWA UNIVERSITY OF HONG KONG</div>
  </header>

  <main>
    <section class="panel" aria-live="polite">
      <div class="character-wrap">
        <img class="character" src="cityu-nailoong.jpg" alt="CityU 奶龙形象">
      </div>
      <p class="eyebrow">One moment</p>
      <h1>正在为你跳转</h1>
      <p class="target" id="target">正在读取目标学校...</p>

      <div class="countdown" id="countdown-ring" aria-label="倒计时 5 秒">
        <div>
          <span class="seconds" id="seconds">5</span>
          <span class="seconds-label">seconds</span>
        </div>
      </div>

      <p class="message" id="message">页面将在 5 秒后自动打开</p>
      <a class="fallback" id="fallback" href="#">立即前往</a>
    </section>
  </main>

  <!-- 页脚编辑区域：可替换版权、联系方式或其他内容 -->
  <footer>
    <p class="runtime" id="runtime">本站已运行中...</p>
    <a class="github-link" href="https://github.com/pai233" target="_blank" rel="noopener noreferrer">GitHub @pai233</a>
  </footer>

  <script src="config.js"></script>
  <script>
    const defaultRedirectUrl = "https://cityu-dg.edu.cn/";
    const targetElement = document.getElementById("target");
    const fallbackElement = document.getElementById("fallback");
    const runtimeElement = document.getElementById("runtime");

    function updateRuntimeText() {
      const startTime = new Date(window.siteStartTime);
      const elapsedSeconds = Number.isNaN(startTime.getTime())
        ? 0
        : Math.max(0, Math.floor((Date.now() - startTime.getTime()) / 1000));
      const days = Math.floor(elapsedSeconds / 86400);
      const hours = Math.floor((elapsedSeconds % 86400) / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;
      runtimeElement.textContent = `本站已运行 ${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
    }

    updateRuntimeText();
    window.setInterval(updateRuntimeText, 1000);

    function getRedirectUrl() {
      const configuredSchools = Array.isArray(window.config) ? window.config : [];
      const schools = configuredSchools
        .map((school) => ({
          url: typeof school.url === "string" ? school.url.trim() : "",
          probability: Number(school.probability ?? school.posibility)
        }))
        .filter((school) => school.url && Number.isFinite(school.probability) && school.probability > 0);

      if (schools.length === 0) {
        return defaultRedirectUrl;
      }

      const totalProbability = schools.reduce((sum, school) => sum + school.probability, 0);
      let randomValue = Math.random() * totalProbability;

      for (const school of schools) {
        randomValue -= school.probability;
        if (randomValue < 0) {
          return school.url;
        }
      }

      return schools[schools.length - 1].url;
    }

    const redirectUrl = getRedirectUrl();
    const targetHost = new URL(redirectUrl).hostname;
    targetElement.textContent = `即将前往：${targetHost}`;
    fallbackElement.href = redirectUrl;
    const totalSeconds = 5;
    let remainingSeconds = totalSeconds;
    const secondsElement = document.getElementById("seconds");
    const messageElement = document.getElementById("message");
    const countdownRing = document.getElementById("countdown-ring");

    const timer = window.setInterval(() => {
      remainingSeconds -= 1;
      secondsElement.textContent = String(Math.max(remainingSeconds, 0));
      countdownRing.style.setProperty("--progress", `${(remainingSeconds / totalSeconds) * 100}%`);
      countdownRing.setAttribute("aria-label", `倒计时 ${Math.max(remainingSeconds, 0)} 秒`);

      if (remainingSeconds <= 0) {
        window.clearInterval(timer);
        messageElement.textContent = "正在打开目标页面...";
        window.location.href = redirectUrl;
      } else {
        messageElement.textContent = `页面将在 ${remainingSeconds} 秒后自动打开`;
      }
    }, 1000);
  </script>
</body>
</html>
