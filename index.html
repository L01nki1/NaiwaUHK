<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="页面跳转中">
  <title>正在跳转</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root {
      --ink: #3f2020;
      --muted: #806265;
      --line: #f2c1a6;
      --paper: #fff8f3;
      --surface: #fffdfb;
      --accent: #ff8a4c;
      --accent-strong: #d83a62;
      --accent-soft: #ffd6b8;
      --warm-yellow: #ffc15a;
      --glow-one: rgba(255, 193, 90, 0.38);
      --glow-two: rgba(216, 58, 98, 0.14);
      --background-start: #fff8f3;
      --background-end: #fff1e7;
      --character-end: #f28a83;
      --button-hover: #ff9b68;
      --shadow: 0 16px 36px rgba(169, 65, 55, 0.16), 0 3px 8px rgba(169, 65, 55, 0.08);
      --ring-shadow: 0 8px 20px rgba(216, 58, 98, 0.18);
      --pulse-shadow: rgba(216, 58, 98, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      background:
        radial-gradient(circle at 88% 10%, var(--glow-one), transparent 25%),
        radial-gradient(circle at 8% 88%, var(--glow-two), transparent 27%),
        linear-gradient(135deg, var(--background-start) 0%, var(--background-end) 100%);
      background-size: 115% 115%, 120% 120%, 100% 100%;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      animation: page-enter 700ms ease both, ambient-drift 18s ease-in-out 700ms infinite alternate;
    }

    header,
    footer {
      min-height: 64px;
      display: flex;
      align-items: center;
      padding: 14px clamp(20px, 7vw, 112px);
      border-color: var(--line);
    }

    header {
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      animation: slide-down 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    footer {
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      background: var(--surface);
      animation: slide-up 700ms cubic-bezier(0.22, 1, 0.36, 1) 160ms both;
    }

    .runtime {
      margin: 0;
    }

    .github-link {
      padding: 9px 15px;
      border: 1px solid var(--accent-strong);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    .github-link:hover {
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .github-link:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .brand {
      color: var(--ink);
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.02em;
    }

    .header-note {
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .repository-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid var(--accent-strong);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease;
    }

    .repository-link:hover {
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .repository-link:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: clamp(18px, 4vh, 42px) 24px;
    }

    .panel {
      width: min(100%, 580px);
      padding: clamp(24px, 4vh, 42px) clamp(28px, 5vw, 56px);
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
      animation: panel-enter 800ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
    }

    .character-wrap {
      display: grid;
      height: clamp(132px, 24vh, 188px);
      margin: -12px auto 22px;
      place-items: end center;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.9), transparent 42%),
        linear-gradient(145deg, var(--warm-yellow), var(--accent-soft) 55%, var(--character-end));
      background-size: 100% 100%, 180% 180%;
      animation: gradient-shift 10s ease-in-out infinite alternate;
    }

    .character {
      display: block;
      width: min(100%, 280px);
      height: 218px;
      object-fit: contain;
      mix-blend-mode: multiply;
      animation: character-float 3.6s ease-in-out infinite;
    }

    .eyebrow {
      display: inline-flex;
      margin: 0 0 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-family: "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      animation: fade-up 600ms ease 420ms both;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
      animation: fade-up 650ms ease 500ms both;
    }

    .target {
      margin: 12px 0 22px;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      overflow-wrap: anywhere;
      animation: fade-up 650ms ease 580ms both;
    }

    .countdown {
      display: grid;
      width: clamp(112px, 18vh, 142px);
      height: clamp(112px, 18vh, 142px);
      margin: 0 auto 22px;
      place-items: center;
      position: relative;
      border-radius: 50%;
      background: conic-gradient(var(--accent-strong) var(--progress, 100%), var(--accent-soft) 0);
      animation: breathe 2s ease-in-out infinite, ring-glow 3s ease-in-out 800ms infinite;
      box-shadow: var(--ring-shadow);
    }

    .countdown::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--surface);
    }

    .seconds {
      position: relative;
      color: var(--ink);
      font-size: clamp(44px, 7vh, 54px);
      font-weight: 700;
      line-height: 1;
    }

    .seconds-label {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .message {
      margin: 0;
      color: var(--muted);
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      animation: fade-up 650ms ease 720ms both;
    }

    .fallback {
      display: inline-block;
      margin-top: 16px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 4px 10px var(--pulse-shadow);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      animation: fade-up 650ms ease 820ms both, button-pulse 3.8s ease-in-out 2s infinite;
    }

    .fallback:hover {
      background: var(--button-hover);
      box-shadow: 0 7px 14px var(--pulse-shadow);
      text-decoration: none;
      transform: translateY(-2px);
    }

    .fallback:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    @keyframes breathe {
      0%,
      100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes page-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes ambient-drift {
      from { background-position: 0% 0%, 100% 100%, 0% 0%; }
      to { background-position: 8% 5%, 92% 94%, 0% 0%; }
    }

    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes panel-enter {
      from { opacity: 0; transform: translateY(22px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradient-shift {
      from { background-position: 0% 0%, 0% 50%; }
      to { background-position: 0% 0%, 100% 50%; }
    }

    @keyframes ring-glow {
      0%,
      100% { filter: drop-shadow(0 8px 20px var(--ring-shadow)); }
      50% { filter: drop-shadow(0 10px 28px var(--pulse-shadow)); }
    }

    @keyframes button-pulse {
      0%,
      70%,
      100% { box-shadow: 0 4px 10px var(--pulse-shadow); }
      82% { box-shadow: 0 7px 20px var(--pulse-shadow); }
    }

    @keyframes character-float {
      0%,
      100% { transform: translateY(4px); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 520px) {
      header,
      footer {
        min-height: 68px;
        padding: 16px 20px;
      }

      footer {
        flex-direction: column;
        gap: 12px;
      }

      .header-note {
        display: none;
      }

      main {
        padding: 18px 16px 24px;
      }

      .panel {
        padding: 24px 22px 28px;
        border-radius: 26px;
      }

      .character-wrap {
        height: 150px;
        margin: -8px auto 22px;
        border-radius: 22px;
      }

      .character {
        height: 178px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <!-- 页眉编辑区域：可替换品牌、导航或其他内容 -->
  <header>
    <div class="brand">香港奶蛙大學</div>
    <div class="header-actions">
      <div class="header-note">NAIWA UNIVERSITY OF HONG KONG</div>
      <a class="repository-link" href="https://github.com/pai233/NaiwaUHK" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
        项目仓库
      </a>
    </div>
  </header>

  <main>
    <section class="panel" aria-live="polite">
      <div class="character-wrap">
        <img class="character" id="mascot" src="default-nailoong.jpg" alt="默认奶蛙形象">
      </div>
      <p class="eyebrow">One moment</p>
      <h1>正在为你跳转</h1>
      <p class="target" id="target">正在读取目标学校...</p>

      <div class="countdown" id="countdown-ring" aria-label="倒计时 5 秒">
        <div>
          <span class="seconds" id="seconds">5</span>
          <span class="seconds-label">seconds</span>
        </div>
      </div>

      <p class="message" id="message">页面将在 5 秒后自动打开</p>
      <a class="fallback" id="fallback" href="#">立即前往</a>
    </section>
  </main>

  <!-- 页脚编辑区域：可替换版权、联系方式或其他内容 -->
  <footer>
    <p class="runtime" id="runtime">本站已运行中...</p>
    <a class="github-link" href="https://github.com/pai233" target="_blank" rel="noopener noreferrer">GitHub @pai233</a>
  </footer>

  <script src="config.js"></script>
  <script>
    const defaultRedirectUrl = "https://cityu-dg.edu.cn/";
    const targetElement = document.getElementById("target");
    const fallbackElement = document.getElementById("fallback");
    const runtimeElement = document.getElementById("runtime");
    const mascotElement = document.getElementById("mascot");

    function updateRuntimeText() {
      const startTime = new Date(window.siteStartTime);
      const elapsedSeconds = Number.isNaN(startTime.getTime())
        ? 0
        : Math.max(0, Math.floor((Date.now() - startTime.getTime()) / 1000));
      const days = Math.floor(elapsedSeconds / 86400);
      const hours = Math.floor((elapsedSeconds % 86400) / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;
      runtimeElement.textContent = `本站已运行 ${days} 天 ${hours} 小时 ${minutes} 分 ${seconds} 秒`;
    }

    updateRuntimeText();
    window.setInterval(updateRuntimeText, 1000);

    function getSelectedSchool() {
      const configuredSchools = Array.isArray(window.config) ? window.config : [];
      const schools = configuredSchools
        .map((school) => ({
          url: typeof school.url === "string" ? school.url.trim() : "",
          probability: Number(school.probability ?? school.posibility),
          characterImage: school.characterImage,
          mascotAlt: school.mascotAlt,
          theme: school.theme
        }))
        .filter((school) => school.url && Number.isFinite(school.probability) && school.probability > 0);

      if (schools.length === 0) {
        return {
          url: defaultRedirectUrl,
          theme: "default"
        };
      }

      const totalProbability = schools.reduce((sum, school) => sum + school.probability, 0);
      let randomValue = Math.random() * totalProbability;

      for (const school of schools) {
        randomValue -= school.probability;
        if (randomValue < 0) {
          return school;
        }
      }

      return schools[schools.length - 1];
    }

    function applySchoolTheme(school) {
      const themes = window.themes || {};
      const theme = themes[school.theme] || themes.default || {};
      const cssVariables = {
        ink: "--ink",
        muted: "--muted",
        line: "--line",
        paper: "--paper",
        surface: "--surface",
        accent: "--accent",
        accentStrong: "--accent-strong",
        accentSoft: "--accent-soft",
        warmYellow: "--warm-yellow",
        glowOne: "--glow-one",
        glowTwo: "--glow-two",
        backgroundStart: "--background-start",
        backgroundEnd: "--background-end",
        characterEnd: "--character-end",
        buttonHover: "--button-hover",
        shadow: "--shadow",
        ringShadow: "--ring-shadow",
        pulseShadow: "--pulse-shadow"
      };

      Object.entries(cssVariables).forEach(([themeKey, cssVariable]) => {
        if (typeof theme[themeKey] === "string") {
          document.documentElement.style.setProperty(cssVariable, theme[themeKey]);
        }
      });

      mascotElement.src = school.characterImage || window.defaultCharacterImage || "default-nailoong.jpg";
      mascotElement.alt = school.mascotAlt || window.defaultMascotAlt || "默认奶蛙形象";
    }

    const selectedSchool = getSelectedSchool();
    applySchoolTheme(selectedSchool);
    const redirectUrl = selectedSchool.url;
    const targetHost = new URL(redirectUrl).hostname;
    targetElement.textContent = `即将前往：${targetHost}`;
    fallbackElement.href = redirectUrl;
    const totalSeconds = 5;
    let remainingSeconds = totalSeconds;
    const secondsElement = document.getElementById("seconds");
    const messageElement = document.getElementById("message");
    const countdownRing = document.getElementById("countdown-ring");

    const timer = window.setInterval(() => {
      remainingSeconds -= 1;
      secondsElement.textContent = String(Math.max(remainingSeconds, 0));
      countdownRing.style.setProperty("--progress", `${(remainingSeconds / totalSeconds) * 100}%`);
      countdownRing.setAttribute("aria-label", `倒计时 ${Math.max(remainingSeconds, 0)} 秒`);

      if (remainingSeconds <= 0) {
        window.clearInterval(timer);
        messageElement.textContent = "正在打开目标页面...";
        window.location.href = redirectUrl;
      } else {
        messageElement.textContent = `页面将在 ${remainingSeconds} 秒后自动打开`;
      }
    }, 1000);
  </script>
</body>
</html>
